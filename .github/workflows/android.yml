name: Build & release

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: "Upload the signed AAB to the Play internal testing track"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK (for sideloading)
        run: ./gradlew testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: akademie-auto-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode signing key
        if: env.HAS_SIGNING_KEY == 'true'
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release AAB
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          name: akademie-auto-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Play internal testing
        if: env.HAS_SIGNING_KEY == 'true' && env.HAS_PLAY_KEY == 'true' && inputs.upload_to_play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.purlife.akademieauto
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
